# Single source of truth for the dependencies (exact versions: this is an application).
#
# Setup from scratch (Python 3.12, Linux; a GPU is optional, the VAE trains on CPU):
#     python3 -m venv .venv
#     source .venv/bin/activate
#     pip install -e ".[dev]"     # the app + tests and notebooks; just the app: pip install -e .
#     sds-download-samples        # sample datasets into ./data (developers and examiners only)

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sds"
version = "0.1.0"
description = "Synthetic Data Sandbox: train a tabular VAE locally and query the synthetic data in natural language."
requires-python = ">=3.12"
dependencies = [
    # Deep learning
    "torch==2.15.0",
    # Data
    "numpy==2.5.4",
    "pandas==3.1.1",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    # Plots
    "matplotlib==3.11.2",
    "seaborn==0.13.2",
    # Backend
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    # UI
    "altair==6.3.0",
    "streamlit==1.67.0",
    "python-multipart==0.0.33",  # required by Streamlit (file uploader); the API reads raw bodies
    "requests==2.34.2",
    # LLM
    "openai==3.46.0",
    "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "httpx==0.28.1",       # FastAPI TestClient
    "jupyterlab==4.6.6",   # benchmark notebook
    "ipykernel==7.4.0",
]

[project.scripts]
sds-download-samples = "sds.samples.download:main"
sds-app = "sds.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests/fixtures"]
